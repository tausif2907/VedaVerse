<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MCQ Quiz</title>
    <style>
        body { 
    text-align: center; 
    padding: 20px; 
}

h1 { 
    color: black; 
    text-shadow: 0 0 8px rgba(0, 0, 0, 0.1); 
}

form { 
    max-width: 600px; 
    margin: 20px auto; 
    background-color: #f9f9f9; 
    padding: 20px; 
    border-radius: 8px; 
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
}

.question { 
    margin: 15px 0; 
    color: black;
}

.options { 
    width: 100%;
    margin-top: 10px; 
    text-align: left; 
}

.option input { 
    margin-right: 10px; 
}

button[type="submit"] { 
    background-color: #ff8800; 
    color: #ffffff; 
    padding: 10px 20px; 
    border: none; 
    border-radius: 4px; 
    font-size: 16px; 
    cursor: pointer; 
    transition: background-color 0.3s ease; 
}

button[type="submit"]:hover { 
    background-color: #cc6f00; 
}

    </style>
</head>
<body>
    {% include 'nav.html' %}
    <h1>Multiple-Choice Quiz</h1>
    <form action="" method="post">
        {% csrf_token %}
        {% for mcq in mcqs %}
            <div class="question">
                <p><strong>{{ forloop.counter }}. {{ mcq.question }}</strong></p>
                <div class="options">
                    {% for option in mcq.options %}
                        <div class="option">
                            <label>
                                <input type="radio" name="answer_{{ forloop.parentloop.counter0 }}" value="{{ option }}" required>
                                {{ option }}
                            </label>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
        <button type="submit">Submit Answers</button>
    </form>
</body>
</html>
