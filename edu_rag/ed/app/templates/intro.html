<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <title>VedaVerse</title>
    {% load static %}
    <style>
        
        @font-face {
            font-family: 'Edrgo';
            src: url('https://fonts.cdnfonts.com/s/38523/EdrgoByBaqoos-Regular.ttf') format('truetype');
        }

    .welcome {
        position: relative;
        height: 78vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
    }

    .welcome video {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2; 
    }

    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5); 
        z-index: -1; 
    }

    .title {
        position: relative;
        font-family: "Silkscreen", sans-serif;
        font-weight: 700;
        font-size: 60px;
        color: #FFFF;
        display: flex;
        gap: 10px;
    }

    .title span {
        opacity: 0;
        transform: translateY(20px);
        animation: fadeIn 0.5s ease-in-out forwards;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Animating Each Letter */
    .title span:nth-child(1) { animation-delay: 0.1s; }
    .title span:nth-child(2) { animation-delay: 0.2s; }
    .title span:nth-child(3) { animation-delay: 0.3s; }
    .title span:nth-child(4) { animation-delay: 0.4s; }
    .title span:nth-child(5) { animation-delay: 0.5s; }
    .title span:nth-child(6) { animation-delay: 0.6s; }
    .title span:nth-child(7) { animation-delay: 0.7s; }
    .title span:nth-child(8) { animation-delay: 0.8s; }
    .title span:nth-child(9) { animation-delay: 0.9s; }

        /* Container Section */
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80%;
            gap: 300px;
            margin: 50px auto;
            margin-top: 100px;
            margin-bottom: 300px;
        }
        .himg{
            height: 400px;
            width: 200px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
            border-radius: 8px; 
            transition: box-shadow 0.3s ease-in-out;
        }

        .container img {
            width: 50%;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
        }

      
        a {
    display: inline-block;
    padding: 15px 30px;
    font-size: 25px;
    font-weight: bold;
    color: #FFFFFF;
    background-color: black;
    border: none;
    text-decoration: none;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); 
    transition: box-shadow 0.3s ease-in-out, transform 0.3s ease-in-out; /* Smooth hover effect */
}

a:hover {
    box-shadow: 0 0 10px orange, 0 0 15px orange; /* Change glow color to green */
    transform: scale(1.1);
}
    </style>
</head>
<body>
    {% include 'nav.html' %}

    <div class="welcome">
        <video autoplay muted loop>
            <source src="static\BgVid.mp4" type="video/mp4">
            
        </video>
        <div class="overlay"></div>
        <div class="title">
            <span>V</span>
            <span>E</span>
            <span>D</span>
            <span>A</span>
            <span>V</span>
            <span>E</span>
            <span>R</span>
            <span>S</span>
            <span>E</span>
        </div>
        </div>

    <!-- Feature Sections -->
    <div class="container">
        <img src="static\flowchartimg.webp" class="himg" >
        <div class="button-container">
            <a href="{% url 'flowchart' %}" class="button">Workflow AI</a>
        </div>
    </div>

    <div class="container">
        <div class="button-container">
            <a href="{% url 'open_sketchbook' %}" class="button">Sketch AI</a>
        </div>
        <img src="static\sketchbook.jpg" class="himg">
    </div>

    <div class="container">
        <img src="static\summariser.jpg" class="himg">
        <div class="button-container">
            <a href="{% url 'pdf_list' %}" class="button">Anon AI</a>
        </div>
    </div>
</body>
</html>
